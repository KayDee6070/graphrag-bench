name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: graphrag-bench validate-fixtures datasets/fixtures/tiny
      - run: python scripts/study_m2.py
      - run: python scripts/study_m3.py
      - run: graphrag-bench ingest datasets/examples/ingestion --config configs/ingestion.toml --output datasets/processed/ci-example
      - run: graphrag-bench build-graph datasets/processed/ci-example --rules configs/extraction.toml --output datasets/processed/ci-graph
      - run: python -m build --no-isolation
