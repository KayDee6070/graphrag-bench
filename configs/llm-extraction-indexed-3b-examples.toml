# M11 development candidate: five fictional examples demonstrate multiple relations,
# late evidence, ancestry, negation and comparison. Other recipe settings are unchanged.
# Adapted after inspecting development errors; not a held-out evaluation.
[llm_extraction]
prompt_style = "indexed-v1"
strip_entity_whitespace = false

[llm_extraction.model]
model_id = "Qwen/Qwen2.5-3B-Instruct"
revision = "aa8e72537993ba99e69dfaafa59ed015b17504d1"
device = "cpu"
dtype = "float32"
cpu_threads = 4
max_input_tokens = 4096
max_new_tokens = 320

[llm_extraction.entity_types]
Paper = "A named research paper."
Method = "A named algorithm or retrieval method."
Model = "A named machine learning model."
Encoder = "A named encoder that produces representations."
Reranker = "A named model used to reorder retrieved candidates."
Dataset = "A named dataset or benchmark collection."
Metric = "A named evaluation measure."
Task = "A task such as question answering or semantic retrieval."

[[llm_extraction.relations]]
predicate = "BASED_ON"
description = "The subject explicitly builds on the object."
subject_types = ["Method", "Model", "Encoder", "Reranker"]
object_types = ["Method", "Model", "Encoder", "Reranker"]

[[llm_extraction.relations]]
predicate = "USES"
description = "The subject explicitly uses the object as a component."
subject_types = ["Method", "Model", "Encoder", "Reranker"]
object_types = ["Method", "Model", "Encoder", "Reranker"]

[[llm_extraction.relations]]
predicate = "EVALUATED_ON"
description = "The subject was evaluated on the object dataset."
subject_types = ["Method", "Model", "Encoder", "Reranker"]
object_types = ["Dataset"]

[[llm_extraction.relations]]
predicate = "SUPPORTS_TASK"
description = "The subject dataset provides data for the object task."
subject_types = ["Dataset"]
object_types = ["Task"]

[[llm_extraction.relations]]
predicate = "TARGETS"
description = "The subject is intended for the object task."
subject_types = ["Method", "Model", "Encoder", "Reranker"]
object_types = ["Task"]

[[llm_extraction.relations]]
predicate = "MEASURED_BY"
description = "The subject is evaluated using the object metric."
subject_types = ["Method", "Model", "Encoder", "Reranker"]
object_types = ["Metric"]

[[llm_extraction.relations]]
predicate = "REPORTS"
description = "The subject dataset explicitly reports the object metric."
subject_types = ["Dataset"]
object_types = ["Metric"]

[[llm_extraction.relations]]
predicate = "PROPOSES"
description = "The subject paper introduces the object method or model."
subject_types = ["Paper"]
object_types = ["Method", "Model", "Encoder", "Reranker"]

[[llm_extraction.examples]]
source = "The report compares several systems. The Helix method uses the Comet model and the Pulse encoder. Runtime varies with batch size."
response = '''{"entities":[{"id":"e1","name":"Helix","entity_type":"Method"},{"id":"e2","name":"Comet","entity_type":"Model"},{"id":"e3","name":"Pulse","entity_type":"Encoder"}],"relations":[{"subject":"e1","predicate":"USES","object":"e2","quote":"The Helix method uses the Comet model and the Pulse encoder."},{"subject":"e1","predicate":"USES","object":"e3","quote":"The Helix method uses the Comet model and the Pulse encoder."}]}'''

[[llm_extraction.examples]]
source = "Results are averaged across tasks. The Aurora model is initialized from the Quartz model. Aurora and Nimbus use the same training documents."
response = '''{"entities":[{"id":"e1","name":"Aurora","entity_type":"Model"},{"id":"e2","name":"Quartz","entity_type":"Model"}],"relations":[{"subject":"e1","predicate":"BASED_ON","object":"e2","quote":"The Aurora model is initialized from the Quartz model."}]}'''

[[llm_extraction.examples]]
source = "We report latency separately. The Comet model was evaluated on the Tundra dataset."
response = '''{"entities":[{"id":"e1","name":"Comet","entity_type":"Model"},{"id":"e2","name":"Tundra","entity_type":"Dataset"}],"relations":[{"subject":"e1","predicate":"EVALUATED_ON","object":"e2","quote":"The Comet model was evaluated on the Tundra dataset."}]}'''

[[llm_extraction.examples]]
source = "The Comet model is faster than the Pulse encoder. Comet was not evaluated on the Marsh dataset."
response = '''{"entities":[],"relations":[]}'''

[[llm_extraction.examples]]
source = "The report discusses an open research question. We use a batch size of 32 and a learning rate of 0.001."
response = '''{"entities":[],"relations":[]}'''
